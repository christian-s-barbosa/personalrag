[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragcore"
version = "0.1.0"
description = "Núcleo reutilizável de RAG sobre bases de conhecimento em Markdown"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb",
    "sentence-transformers",
    "openai",
    "python-frontmatter",
    "python-dotenv",
]

[project.optional-dependencies]
mcp = ["mcp"]

[project.scripts]
ragcore = "ragcore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
